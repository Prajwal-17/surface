services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      APP_ENV: production
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL for primary-pg/surface-data}
      DATA_DIR: /data
      PORT: "4000"
      AUTH_EMAIL: ${AUTH_EMAIL:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      SEARXNG_BASE_URL: http://searxng:8080
      CRAWLER_BASE_URL: http://crawler:4100
      SOURCE_TIMEOUT_MS: ${SOURCE_TIMEOUT_MS:-12000}
      # 127.0.0.1 is the container here; use the Docker-specific override when
      # OmniRoute is running somewhere other than the host gateway.
      OMNIROUTE_BASE_URL: ${OMNIROUTE_DOCKER_BASE_URL:-http://host.docker.internal:20128/v1}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
      OMNIROUTE_MODEL: ${OMNIROUTE_MODEL:-auto}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - ${FIELDWORK_DATA_DIR:-./data}:/data
    networks:
      - default
      - postgres
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      BACKEND_URL: http://backend:4000
    ports:
      - "127.0.0.1:${FIELDWORK_PROD_WEB_PORT:-3001}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  searxng:
    image: searxng/searxng:2026.9.8-3fdc6d753
    volumes:
      - ./services/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-surface-local-company-research}
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
  crawler:
    build:
      context: .
      dockerfile: apps/crawler/Dockerfile
    init: true
    shm_size: 1gb
    ports:
      - "127.0.0.1:${FIELDWORK_PROD_CRAWLER_PORT:-4101}:4100"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3

# Use the existing primary-pg container; never provision or replace its volume.
networks:
  postgres:
    external: true
    name: ${POSTGRES_NETWORK:-grill-me_default}
