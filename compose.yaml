services:
  backend:
    build:
      context: .
      target: backend
    environment:
      DB_FILE_NAME: /data/job-search.sqlite
      PORT: "4000"
      OMNIROUTE_BASE_URL: ${OMNIROUTE_BASE_URL:-http://host.docker.internal:20128/v1}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
      OMNIROUTE_MODEL: ${OMNIROUTE_MODEL:-auto}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - ${FIELDWORK_DATA_DIR:-./data}:/data
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:${FIELDWORK_WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
