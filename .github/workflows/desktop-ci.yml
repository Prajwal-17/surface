name: Desktop Linux CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.20.0"
  BUN_VERSION: "1.4.1"

jobs:
  checks:
    name: Source checks and SQLite
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run check-types

      - name: Run browser and crawler unit tests
        run: |
          bun --cwd apps/web test
          bun --cwd apps/crawler test

      - name: Verify fresh SQLite desktop storage
        run: bun run verify:sqlite

  backend:
    name: Backend PostgreSQL tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: surface
          POSTGRES_PASSWORD: surface
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U surface -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://surface:surface@127.0.0.1:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Run isolated PostgreSQL backend suite
        run: APP_ENV=test NODE_ENV=test bun --cwd apps/backend test

  package:
    name: Package and smoke-test Linux x64
    needs: [checks, backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Install Electron and Playwright system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libsecret-1-0 libnotify4 xvfb
          ./apps/crawler/node_modules/.bin/playwright install-deps chromium

      - name: Verify native Linux x64 runner
        run: |
          node -e 'if (process.platform !== "linux" || process.arch !== "x64") throw new Error("Expected linux/x64, got " + process.platform + "/" + process.arch)'

      - name: Build production AppImage
        env:
          SURFACE_SOURCE_COMMIT: ${{ steps.checkout.outputs.commit }}
          SURFACE_SOURCE_REF: ${{ github.ref }}
        run: node scripts/desktop-release.mjs package

      - name: Verify staged Playwright Chromium
        run: node scripts/desktop-release.mjs verify-build

      - name: Smoke-test packaged AppImage
        run: node scripts/desktop-release.mjs smoke

      - name: Show artifact checksums
        run: cat apps/desktop/release/SHA256SUMS

      # The AppImage and Debian package together exceed the private
      # repository's Actions artifact storage quota. CI validates the
      # installers; downloadable development installers are published as
      # prerelease assets by the Desktop Development Build workflow.
      - name: Upload build metadata
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surface-desktop-ci-linux-x64-metadata
          path: |
            apps/desktop/release/BUILD-INFO.json
            apps/desktop/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Summarize CI build
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          {
            echo "### Ubuntu desktop CI build"
            echo
            cat apps/desktop/release/SHA256SUMS
            echo
            echo "[Download the build metadata artifact]($ARTIFACT_URL)"
            echo
            echo "Artifact digest: \`$ARTIFACT_DIGEST\`"
            echo
            echo "The installers were built and smoke-tested but are not uploaded here because they exceed the private repository's Actions artifact storage quota."
          } >> "$GITHUB_STEP_SUMMARY"
