name: Desktop Linux CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.20.0"
  BUN_VERSION: "1.4.1"

jobs:
  checks:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run check-types

  package:
    name: Package and verify Linux x64
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Verify native Linux x64 runner
        run: |
          node -e 'if (process.platform !== "linux" || process.arch !== "x64") throw new Error("Expected linux/x64, got " + process.platform + "/" + process.arch)'

      - name: Build production AppImage and Debian package
        env:
          SURFACE_SOURCE_COMMIT: ${{ steps.checkout.outputs.commit }}
          SURFACE_SOURCE_REF: ${{ github.ref }}
        run: bun --cwd apps/desktop package

      - name: Write build metadata and checksums
        env:
          SURFACE_SOURCE_COMMIT: ${{ steps.checkout.outputs.commit }}
          SURFACE_SOURCE_REF: ${{ github.ref }}
        run: node scripts/build-metadata.mjs --channel production

      - name: Show artifact checksums
        run: cat apps/desktop/release/SHA256SUMS

      # CI validates the installers without keeping a second copy of them.
      # Downloadable development installers are uploaded as the surface-dev-*
      # artifacts by the development workflow.
      - name: Upload build metadata
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surface-desktop-ci-linux-x64-metadata
          path: |
            apps/desktop/release/BUILD-INFO.json
            apps/desktop/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Summarize CI build
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          {
            echo "### Ubuntu desktop CI build"
            echo
            cat apps/desktop/release/SHA256SUMS
            echo
            echo "[Download the build metadata artifact]($ARTIFACT_URL)"
            echo
            echo "Artifact digest: \`$ARTIFACT_DIGEST\`"
            echo
            echo "The installers were built and verified but are not uploaded here because they exceed the private repository's Actions artifact storage quota."
          } >> "$GITHUB_STEP_SUMMARY"
