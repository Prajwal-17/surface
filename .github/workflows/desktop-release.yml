name: Desktop Linux Release

on:
  push:
    tags:
      - "desktop-v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, commit, or desktop-v<version> tag to build"
        required: true
        default: master
        type: string
      publish:
        description: "Publish an existing matching desktop-v<version> tag (tag pushes publish automatically)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event_name == 'push' && github.ref_name || inputs.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.20.0"
  BUN_VERSION: "1.4.1"

jobs:
  prepare:
    name: Validate version and release intent
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      publish: ${{ steps.metadata.outputs.publish }}
    steps:
      - name: Check out release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Resolve release metadata
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          REQUESTED_REF: ${{ inputs.ref }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          version="$(node scripts/desktop-release.mjs version)"
          publish=false
          tag=""

          if [[ "$EVENT_NAME" == "push" ]]; then
            tag="$EVENT_REF_NAME"
            publish=true
          elif [[ "$REQUESTED_PUBLISH" == "true" ]]; then
            tag="${REQUESTED_REF#refs/tags/}"
            publish=true
          fi

          if [[ -n "$tag" ]]; then
            expected="desktop-v$version"
            if [[ "$tag" != "$expected" ]]; then
              echo "::error::Tag $tag does not match $expected from apps/desktop/package.json."
              exit 1
            fi
            if ! git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
              echo "::error::Tag $tag does not exist in the checked out repository."
              exit 1
            fi
            if [[ "$(git rev-parse "refs/tags/$tag^{commit}")" != "$(git rev-parse HEAD)" ]]; then
              echo "::error::Tag $tag does not point at the checked out commit."
              exit 1
            fi
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          if [[ -n "$tag" ]]; then
            echo "Release tag validated: $tag" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Build-only run for Surface $version; no release will be published." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Reject an already-published release
        if: steps.metadata.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          if gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx false; then
            echo "::error::Release $TAG is already published; refusing to overwrite it."
            exit 1
          fi

  build:
    name: Build and verify Linux x64 desktop
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out release ref
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Install Electron and Playwright system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libsecret-1-0 libnotify4 xvfb
          ./apps/crawler/node_modules/.bin/playwright install-deps chromium

      - name: Verify native Linux x64 runner
        run: |
          node -e 'if (process.platform !== "linux" || process.arch !== "x64") throw new Error("Expected linux/x64, got " + process.platform + "/" + process.arch)'

      - name: Run source checks
        run: |
          bun run format:check
          bun run lint
          bun run check-types
          bun --cwd apps/web test
          bun --cwd apps/crawler test
          bun run verify:sqlite

      - name: Verify release version
        if: needs.prepare.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: node scripts/desktop-release.mjs version --tag "$RELEASE_TAG"

      - name: Build production Linux artifacts
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SURFACE_SOURCE_COMMIT: ${{ steps.checkout.outputs.commit }}
          SURFACE_SOURCE_REF: ${{ inputs.ref || github.ref }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            node scripts/desktop-release.mjs package --tag "$RELEASE_TAG"
          else
            node scripts/desktop-release.mjs package
          fi

      - name: Verify staged Playwright Chromium
        run: node scripts/desktop-release.mjs verify-build

      - name: Smoke-test packaged AppImage with a fresh profile
        run: node scripts/desktop-release.mjs smoke

      - name: Show artifact checksums
        run: cat apps/desktop/release/SHA256SUMS

      - name: Upload temporary release artifact
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surface-desktop-release-linux-x64
          path: |
            apps/desktop/release/Surface-*.AppImage
            apps/desktop/release/Surface-*.deb
            apps/desktop/release/BUILD-INFO.json
            apps/desktop/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Summarize build
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          {
            echo "### Surface $VERSION Ubuntu desktop build"
            echo
            cat apps/desktop/release/SHA256SUMS
            echo
            if [[ -n "$TAG" ]]; then
              echo "Tag \`$TAG\` validated. Artifacts are ready for the publish job."
            else
              echo "Build-only run; no GitHub release will be created."
              echo
              echo "[Download the temporary artifact]($ARTIFACT_URL)"
            fi
            echo
            echo "Artifact digest: \`$ARTIFACT_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish GitHub release
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    environment: desktop-release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: surface-desktop-release-linux-x64
          path: release-assets

      - name: Verify artifact checksums
        run: |
          cd release-assets
          sha256sum --check SHA256SUMS
          ls -lh

      - name: Create or update draft release
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx true; then
            gh release edit "$TAG" --verify-tag --title "Surface $VERSION"
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG is already published; refusing to overwrite it."
            exit 1
          else
            gh release create "$TAG" --draft --verify-tag --title "Surface $VERSION" --generate-notes
          fi

      - name: Attest release artifacts when enabled
        if: vars.DESKTOP_ATTESTATIONS == 'true'
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release-assets/SHA256SUMS

      - name: Upload release assets
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" release-assets/* --clobber

      - name: Publish release
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --verify-tag --draft=false --latest

      - name: Summarize release
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          {
            echo "### Surface $VERSION released"
            echo
            echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
            echo
            cat release-assets/SHA256SUMS
            echo
            if [[ -n "$ATTESTATION_URL" ]]; then
              echo "Provenance attestation: $ATTESTATION_URL"
            else
              echo "Provenance: BUILD-INFO.json (GitHub attestations are not enabled for this repository)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
