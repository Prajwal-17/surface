name: Desktop Linux Release

on:
  push:
    tags:
      - "desktop-v*.*.*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.20.0"
  BUN_VERSION: "1.4.1"

jobs:
  prepare:
    name: Validate tag and prepare draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Validate the tag and changelog entry
        id: metadata
        run: |
          set -euo pipefail
          version="$(node scripts/desktop-release.mjs version)"
          tag="$GITHUB_REF_NAME"
          expected="desktop-v$version"

          if [[ "$tag" != "$expected" ]]; then
            echo "::error::Tag $tag does not match $expected from apps/desktop/package.json."
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag does not exist in the checked out repository."
            exit 1
          fi
          if [[ "$(git rev-parse "refs/tags/$tag^{commit}")" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::Tag $tag does not point at the checked out commit."
            exit 1
          fi

          node scripts/release-notes.mjs "$version" > release-notes.md
          {
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "Release tag validated: $tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Reject an already-published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          if gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx false; then
            echo "::error::Release $TAG is already published; refusing to overwrite it."
            exit 1
          fi

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx true; then
            gh release edit "$TAG" --verify-tag --title "Surface $VERSION" --notes-file release-notes.md
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG is already published; refusing to overwrite it."
            exit 1
          else
            gh release create "$TAG" --draft --verify-tag --title "Surface $VERSION" --notes-file release-notes.md
          fi
          echo "Draft release prepared: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build, test, and attach Linux x64 installers
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out the release tag
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Install Electron and Playwright system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libsecret-1-0 libnotify4 xvfb
          ./apps/crawler/node_modules/.bin/playwright install-deps chromium

      - name: Verify native Linux x64 runner
        run: |
          node -e 'if (process.platform !== "linux" || process.arch !== "x64") throw new Error("Expected linux/x64, got " + process.platform + "/" + process.arch)'

      - name: Run source checks
        run: |
          bun run format:check
          bun run lint
          bun run check-types
          bun --cwd apps/web test
          bun --cwd apps/crawler test
          bun run verify:sqlite

      - name: Verify the release version
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: node scripts/desktop-release.mjs version --tag "$RELEASE_TAG"

      - name: Build production Linux artifacts
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SURFACE_SOURCE_COMMIT: ${{ steps.checkout.outputs.commit }}
          SURFACE_SOURCE_REF: ${{ github.ref }}
        run: node scripts/desktop-release.mjs package --tag "$RELEASE_TAG"

      - name: Verify staged Playwright Chromium
        run: node scripts/desktop-release.mjs verify-build

      - name: Smoke-test the packaged AppImage with a fresh profile
        run: node scripts/desktop-release.mjs smoke

      - name: Show artifact checksums
        run: cat apps/desktop/release/SHA256SUMS

      # Attach installers directly to the draft release. Production assets do
      # not consume the shared Actions artifact storage allowance.
      - name: Attach installers to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            apps/desktop/release/Surface-*.AppImage \
            apps/desktop/release/Surface-*.deb \
            apps/desktop/release/BUILD-INFO.json \
            apps/desktop/release/SHA256SUMS \
            --clobber

      - name: Upload release metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surface-desktop-release-metadata
          path: |
            apps/desktop/release/BUILD-INFO.json
            apps/desktop/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Summarize the build
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          {
            echo "### Surface $VERSION Ubuntu desktop build"
            echo
            cat apps/desktop/release/SHA256SUMS
            echo
            echo "Installers were attached to the draft release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    environment: desktop-release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download release metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: surface-desktop-release-metadata
          path: release-metadata

      - name: Verify the draft release assets
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for required in \
            "Surface-${VERSION}-x86_64.AppImage" \
            "Surface-${VERSION}-amd64.deb" \
            "BUILD-INFO.json" \
            "SHA256SUMS"; do
            if ! grep -qxF "$required" <<< "$assets"; then
              echo "::error::Missing release asset $required on $TAG."
              exit 1
            fi
          done
          ls -lh release-metadata
          cat release-metadata/SHA256SUMS

      - name: Attest release artifacts when enabled
        if: vars.DESKTOP_ATTESTATIONS == 'true'
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release-metadata/SHA256SUMS

      - name: Publish the release
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --verify-tag --draft=false --latest

      - name: Summarize the release
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          {
            echo "### Surface $VERSION released"
            echo
            echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
            echo
            cat release-metadata/SHA256SUMS
            echo
            if [[ -n "$ATTESTATION_URL" ]]; then
              echo "Provenance attestation: $ATTESTATION_URL"
            else
              echo "Provenance: BUILD-INFO.json (GitHub attestations are not enabled for this repository)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
