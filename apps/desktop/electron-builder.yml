appId: dev.surface.desktop
productName: Surface
artifactName: Surface-${version}-${arch}.${ext}
directories:
  output: release
files:
  - dist/**/*
  - package.json
extraResources:
  - from: build/web
    to: web
  - from: build/backend
    to: backend
  - from: resources/icon.png
    to: icon.png
asar: true
npmRebuild: false
# Packaging scripts must never publish. Release uploads happen only in GitHub
# Actions after the build and smoke test succeed.
publish: null
linux:
  target:
    - AppImage
    - deb
  category: Utility
  executableName: surface
  icon: resources/icon.png
  synopsis: Local company and application tracker
  description: Surface keeps your company tracker, applications and profile on your machine.
  desktop:
    entry:
      StartupWMClass: surface
  maintainer: Surface <desktop@surface.local>
  syncDesktopName: true
deb:
  packageName: surface
  compression: xz
extraMetadata:
  desktopName: surface.desktop
