<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Find, understand, and keep track of jobs that fit you."
    />
    <title>Surface — Your career workspace</title>
    <script>
      try {
        const theme = localStorage.getItem("surface-theme");
        document.documentElement.classList.toggle(
          "dark",
          theme
            ? theme !== "light"
            : matchMedia("(prefers-color-scheme: dark)").matches,
        );
        matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (event) => {
          try {
            if (localStorage.getItem("surface-theme")) return;
          } catch {}
          document.documentElement.classList.toggle("dark", event.matches);
          window.dispatchEvent(new Event("surface-theme"));
        });
      } catch {
        document.documentElement.classList.toggle("dark", matchMedia("(prefers-color-scheme: dark)").matches);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
